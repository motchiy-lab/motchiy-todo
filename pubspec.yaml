name: motchiy_todo
description: "カレンダーとメモ帳の中間をとったタスク管理アプリ"
publish_to: 'none'
version: 1.2.1+6

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  crypto: ^3.0.6
  google_sign_in: ^6.2.1
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "ic_launcher"
  ios: "true"
  adaptive_icon_background: "#504E7F"
  adaptive_icon_foreground: "assets/android_icon_foreground.png"
  image_path: "assets/app_icon.png"
