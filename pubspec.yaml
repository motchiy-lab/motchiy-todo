name: motchiy_todo
description: "カレンダーとメモ帳の中間をとったタスク管理アプリ"
publish_to: 'none'
version: 2.0.0

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  google_sign_in: ^6.2.1
  http: ^1.4.0
  intl: ^0.20.3
  launch_at_startup: ^0.5.1
  shared_preferences: ^2.5.5
  tray_manager: ^0.8.0
  url_launcher: ^6.3.2
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: "true"
  adaptive_icon_background: "#504E7F"
  adaptive_icon_foreground: "assets/android_icon_foreground.png"
  image_path: "assets/app_icon.png"
