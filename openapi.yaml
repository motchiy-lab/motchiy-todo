openapi: 3.1.0
info:
  title: Motchiy ToDo API
  version: 1.0.0
  description: |
    REST API used by the Motchiy ToDo client. Implement these operations in the
    server application. Protected data is always scoped to the user and session
    identified by the validated bearer access token; clients cannot select a
    data owner.
servers:
  - url: https://api.example.com
    description: Replace with the deployed HTTPS API origin.
tags:
  - name: Health
  - name: Authentication
  - name: Tasks
  - name: Settings
paths:
  /health:
    get:
      tags: [Health]
      operationId: health
      summary: Check API and MongoDB availability
      responses:
        "200":
          description: API and MongoDB are available.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Register an account and send an email verification code
      description: |
        Email is normalized to lowercase. Passwords must contain at least 12
        characters and be no more than 128 UTF-8 bytes. The account cannot log
        in until its email is verified. Apply IP- and account-based rate limits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, displayName]
              properties:
                email:
                  $ref: "#/components/schemas/Email"
                password:
                  $ref: "#/components/schemas/Password"
                displayName:
                  $ref: "#/components/schemas/DisplayName"
      responses:
        "202":
          description: Verification code sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: An account with this email already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/verification/resend:
    post:
      tags: [Authentication]
      operationId: resendVerificationCode
      summary: Resend an email verification code
      description: |
        Returns the same response whether or not an unverified account exists,
        to avoid disclosing account existence. Apply IP- and account-based rate
        limits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  $ref: "#/components/schemas/Email"
      responses:
        "202":
          description: Accepted whether or not an unverified account exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/verify-email:
    post:
      tags: [Authentication]
      operationId: verifyEmail
      summary: Verify an email address and create a session
      description: |
        Verification codes contain six digits, expire after 15 minutes, and
        are limited to five attempts. A successful verification returns the
        same token response as login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, code]
              properties:
                email:
                  $ref: "#/components/schemas/Email"
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
      responses:
        "200":
          $ref: "#/components/responses/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate with email and password
      description: Email must be verified before login. Apply IP- and account-based rate limits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  $ref: "#/components/schemas/Email"
                password:
                  type: string
                  maxLength: 128
      responses:
        "200":
          $ref: "#/components/responses/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      summary: Rotate a refresh token and issue a new access token
      description: The old refresh token is invalidated when it is successfully rotated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  minLength: 1
                  maxLength: 256
      responses:
        "200":
          $ref: "#/components/responses/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current session
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks:
    get:
      tags: [Tasks]
      operationId: getTasks
      summary: Get the authenticated user's task list
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The user's tasks, or an empty list when none are stored.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    maxItems: 5000
                    items:
                      $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Tasks]
      operationId: replaceTasks
      summary: Replace the authenticated user's task list
      description: |
        Task objects reject properties other than those defined in the schema.
        Ownership is taken only from the validated bearer token, never from the
        request body.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tasks]
              properties:
                tasks:
                  type: array
                  maxItems: 5000
                  items:
                    $ref: "#/components/schemas/Task"
      responses:
        "204":
          description: Task list replaced.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: Get the authenticated user's settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User settings, including defaults for settings not yet saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Settings]
      operationId: patchSettings
      summary: Partially update the authenticated user's settings
      description: Only the listed settings are accepted. Ownership is taken from the bearer token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "204":
          description: Settings updated.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Email:
      type: string
      format: email
      maxLength: 254
    Password:
      type: string
      minLength: 12
      maxLength: 128
      description: At most 128 UTF-8 bytes.
    DisplayName:
      type: string
      minLength: 1
      maxLength: 80
    Message:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
    User:
      type: object
      additionalProperties: false
      required: [id, email, displayName, photoUrl]
      properties:
        id:
          type: string
          description: Server-issued user identifier.
        email:
          $ref: "#/components/schemas/Email"
        displayName:
          $ref: "#/components/schemas/DisplayName"
        photoUrl:
          type: [string, "null"]
    TokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: Bearer access token, valid for 900 seconds.
        refreshToken:
          type: string
          description: Opaque refresh token; rotate it using POST /auth/refresh.
        expiresIn:
          type: integer
          const: 900
        user:
          $ref: "#/components/schemas/User"
    Task:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        title:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 10000
          default: ""
        isCompleted:
          type: boolean
          default: false
        hasDueDate:
          type: boolean
          default: false
        startDate:
          type: [string, "null"]
          format: date-time
        dueDate:
          type: [string, "null"]
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
    Settings:
      type: object
      additionalProperties: false
      properties:
        themeColorIndex:
          type: integer
          minimum: 0
          maximum: 5
          default: 0
        themeModeIndex:
          type: integer
          minimum: 0
          maximum: 2
          default: 0
        enableTabAnimations:
          type: boolean
          default: true
    SettingsPatch:
      type: object
      additionalProperties: false
      properties:
        themeColorIndex:
          type: integer
          minimum: 0
          maximum: 5
        themeModeIndex:
          type: integer
          minimum: 0
          maximum: 2
        enableTabAnimations:
          type: boolean
  responses:
    TokenResponse:
      description: Authentication succeeded and a session was created or refreshed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TokenResponse"
    BadRequest:
      description: Request JSON or one or more fields are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    Unauthorized:
      description: Authentication failed, token is invalid, or session expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    TooManyRequests:
      description: Authentication or verification rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    ServiceUnavailable:
      description: MongoDB is not available.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
