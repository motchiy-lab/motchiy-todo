openapi: 3.1.0
info:
  title: Motchiy ToDo API
  version: 1.0.0
  description: |
    Motchiy ToDoクライアントが使用するREST APIです。各操作はサーバーアプリケーションに
    実装してください。保護されたデータは、検証済みBearerアクセストークンで特定された
    ユーザーとセッションに必ず紐付きます。クライアントがデータ所有者を指定することはできません。
servers:
  - url: https://api.motchiy.com
    description: 実際にデプロイしたHTTPS APIのベースURLに置き換えてください。
tags:
  - name: ヘルスチェック
  - name: 認証
  - name: タスク
  - name: 設定
paths:
  /health:
    get:
      tags: [ヘルスチェック]
      operationId: health
      summary: APIとMongoDBの稼働状態を確認
      responses:
        "200":
          description: APIとMongoDBが利用可能です。
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/register:
    post:
      tags: [認証]
      operationId: register
      summary: アカウントを登録してログイン
      description: |
        メールアドレスは小文字に正規化します。パスワードは12文字以上、UTF-8で128バイト
        以下にしてください。登録後、Resendで6桁の認証コードを送信します。コードの有効期限は15分です。
        メール認証完了前はログインできません。IPアドレスおよびアカウント単位のレート制限を適用してください。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, displayName]
              properties:
                email:
                  $ref: "#/components/schemas/Email"
                password:
                  $ref: "#/components/schemas/Password"
                displayName:
                  $ref: "#/components/schemas/DisplayName"
      responses:
        "202":
          description: 登録を受け付け、確認コードを送信しました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: このメールアドレスのアカウントはすでに登録されています。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/verification/resend:
    post:
      tags: [認証]
      operationId: resendVerificationCode
      summary: メール認証コードを再送信
      description: |
        メールアドレスが登録済みかどうかを応答から判別できないようにします。
        IPアドレスおよびメールアドレスごとの送信回数を制限してください。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  $ref: "#/components/schemas/Email"
      responses:
        "202":
          description: リクエストを受け付けました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/verify-email:
    post:
      tags: [認証]
      operationId: verifyEmail
      summary: メールアドレスを認証してセッションを作成
      description: |
        有効期限内の6桁の認証コードを検証します。5回を超える誤入力は拒否します。
        認証成功時にはログイン応答を返します。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, code]
              properties:
                email:
                  $ref: "#/components/schemas/Email"
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
      responses:
        "200":
          $ref: "#/components/responses/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      tags: [認証]
      operationId: login
      summary: メールアドレスとパスワードでログイン
      description: メールアドレスとパスワードを検証します。未認証のアカウントには403を返します。
        IPアドレスおよびアカウント単位のレート制限を適用してください。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  $ref: "#/components/schemas/Email"
                password:
                  type: string
                  maxLength: 128
      responses:
        "200":
          $ref: "#/components/responses/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: メールアドレスが未認証です。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/refresh:
    post:
      tags: [認証]
      operationId: refreshSession
      summary: リフレッシュトークンを更新して新しいアクセストークンを発行
      description: 更新に成功すると、古いリフレッシュトークンは無効になります。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  minLength: 1
                  maxLength: 256
      responses:
        "200":
          $ref: "#/components/responses/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/logout:
    post:
      tags: [認証]
      operationId: logout
      summary: 現在のセッションを無効化
      security:
        - bearerAuth: []
      responses:
        "204":
          description: セッションを無効化しました。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /tasks:
    get:
      tags: [タスク]
      operationId: getTasks
      summary: 認証済みユーザーのタスク一覧を取得
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ユーザーのタスク一覧。保存済みのタスクがない場合は空の配列を返します。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    maxItems: 5000
                    items:
                      $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [タスク]
      operationId: replaceTasks
      summary: 認証済みユーザーのタスク一覧を置き換え
      description: |
        スキーマで定義されていないプロパティを含むタスクは拒否してください。
        所有者は検証済みBearerトークンだけから特定し、リクエスト本文から決定してはいけません。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tasks]
              properties:
                tasks:
                  type: array
                  maxItems: 5000
                  items:
                    $ref: "#/components/schemas/Task"
      responses:
        "204":
          description: タスク一覧を置き換えました。
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /settings:
    get:
      tags: [設定]
      operationId: getSettings
      summary: 認証済みユーザーの設定を取得
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 未保存項目には初期値を適用したユーザー設定を返します。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [設定]
      operationId: patchSettings
      summary: 認証済みユーザーの設定を部分更新
      description: 定義された設定項目のみ受け付けます。所有者はBearerトークンから特定します。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "204":
          description: 設定を更新しました。
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Email:
      type: string
      format: email
      maxLength: 254
    Password:
      type: string
      minLength: 12
      maxLength: 128
      description: UTF-8で128バイト以下にしてください。
    DisplayName:
      type: string
      minLength: 1
      maxLength: 80
    Message:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
    User:
      type: object
      additionalProperties: false
      required: [id, email, displayName, photoUrl, emailVerified]
      properties:
        id:
          type: string
          format: uuid
          description: サーバーが発行した変更されないユーザーUUID。
        email:
          $ref: "#/components/schemas/Email"
        displayName:
          $ref: "#/components/schemas/DisplayName"
        photoUrl:
          type: [string, "null"]
        emailVerified:
          type: boolean
          const: true
    TokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: 900秒間有効なBearerアクセストークン。
        refreshToken:
          type: string
          description: 不透明なリフレッシュトークン。POST /auth/refreshで更新してください。
        expiresIn:
          type: integer
          const: 900
        user:
          $ref: "#/components/schemas/User"
    Task:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        title:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 10000
          default: ""
        isCompleted:
          type: boolean
          default: false
        hasDueDate:
          type: boolean
          default: false
        startDate:
          type: [string, "null"]
          description: ISO 8601日時。タイムゾーン付きまたはタイムゾーンなしの形式を受け付けます。
        dueDate:
          type: [string, "null"]
          description: ISO 8601日時。タイムゾーン付きまたはタイムゾーンなしの形式を受け付けます。
        completedAt:
          type: [string, "null"]
          description: ISO 8601日時。タイムゾーン付きまたはタイムゾーンなしの形式を受け付けます。
    Settings:
      type: object
      additionalProperties: false
      properties:
        themeColorIndex:
          type: integer
          minimum: 0
          maximum: 5
          default: 0
        themeModeIndex:
          type: integer
          minimum: 0
          maximum: 2
          default: 0
        enableTabAnimations:
          type: boolean
          default: true
    SettingsPatch:
      type: object
      additionalProperties: false
      properties:
        themeColorIndex:
          type: integer
          minimum: 0
          maximum: 5
        themeModeIndex:
          type: integer
          minimum: 0
          maximum: 2
        enableTabAnimations:
          type: boolean
  responses:
    TokenResponse:
      description: 認証に成功し、セッションを作成または更新しました。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TokenResponse"
    BadRequest:
      description: リクエストJSONまたは入力項目が不正です。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    Unauthorized:
      description: 認証に失敗したか、トークンが無効、またはセッションの有効期限が切れています。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    TooManyRequests:
      description: 認証リクエストがレート制限を超えました。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    InternalError:
      description: 予期しないサーバーエラーが発生しました。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    ServiceUnavailable:
      description: MongoDBを利用できません。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
